name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Download benchmark corpora
        run: ./benchmarks/scripts/download.sh
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: EL Pizza golden conformance
        run: ./benchmarks/scripts/compare-pizza-el-golden.sh
      - name: HermiT conformance (Tier A)
        run: cargo test -p ontologos-conformance
      - name: Reasonable RL adapter conformance
        run: ./benchmarks/scripts/compare-reasonable.sh
      - name: Build CLI
        run: cargo build -p ontologos-cli --release

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: Download benchmark corpora
        run: ./benchmarks/scripts/download.sh
      - name: Test (MSRV)
        run: cargo test --workspace --locked

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build and test Python package
        working-directory: crates/ontologos-py
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install 'maturin>=1.7,<2.0' pytest
          maturin develop --release
          pytest tests/ -q

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install MkDocs
        run: pip install -r docs/requirements.txt
      - name: Build documentation site
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: mkdocs build --strict
