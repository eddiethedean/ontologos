name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Cap per-operation DL wall time in conformance (entailment may run classify twice).
  ONTOLOGOS_DL_BUDGET_SECS: "30"
  # Blocking CI runs only promoted passing cases; full suite is in conformance-nightly.
  ONTOLOGOS_CI_PROMOTED_ONLY: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Download benchmark corpora
        run: ./benchmarks/scripts/download.sh
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --exclude ontologos-conformance --locked
      - name: HermiT ignore budget
        run: |
          chmod +x benchmarks/scripts/check-hermit-ignore-budget.sh
          ./benchmarks/scripts/check-hermit-ignore-budget.sh
      - name: EL Pizza golden conformance
        run: ./benchmarks/scripts/compare-pizza-el-golden.sh
      - name: HermiT conformance (Tier A — Java catalog)
        run: >-
          cargo test -p ontologos-conformance --release --locked
          --test hermit_generated
          --test hermit_rdfs
          --test hermit_rl
          --test hermit_el
          --test hermit_parser
          --test dl_subsumption_cases
          --test explain_benchmarks
          --
          --test-threads=4
          --skip planned_engine_failure_scan
          --skip ian_backjumping3_axiom_check_completes_within_budget
      - name: Conformance test inventory
        run: |
          chmod +x benchmarks/scripts/report-conformance-coverage.sh
          ./benchmarks/scripts/report-conformance-coverage.sh
      - name: DL OFN pass rate (informational)
        run: |
          chmod +x benchmarks/scripts/report-dl-ofn-pass-rate.sh
          ./benchmarks/scripts/report-dl-ofn-pass-rate.sh || true
      - name: 1.0 release gates (informational)
        run: |
          chmod +x benchmarks/scripts/check-1.0-release-gates.sh
          ./benchmarks/scripts/check-1.0-release-gates.sh || true
      - name: HermiT parity phases (informational until Phase 9)
        run: |
          chmod +x benchmarks/scripts/check-hermit-parity-phases.sh
          ./benchmarks/scripts/check-hermit-parity-phases.sh || true
      - name: HermiT catalog drift check
        run: |
          chmod +x benchmarks/scripts/check-hermit-catalog.sh
          ./benchmarks/scripts/check-hermit-catalog.sh
      - name: Tier C reference harness smoke
        run: |
          chmod +x benchmarks/scripts/compare-hermit-tier-c.sh
          chmod +x benchmarks/scripts/compare-dl-taxonomy.sh
          chmod +x benchmarks/scripts/compare-taxonomy.py
          ./benchmarks/scripts/compare-hermit-tier-c.sh
      - name: Reasonable RL adapter conformance
        run: ./benchmarks/scripts/compare-reasonable.sh
      - name: EL incremental correctness
        run: cargo test -p ontologos-el --test incremental_correctness --locked
      - name: Phase 3 closure gate
        run: cargo test -p ontologos-conformance --test phase3_closure --locked
      - name: Build CLI
        run: cargo build -p ontologos-cli --release

  python-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Download benchmark corpora
        run: bash ./benchmarks/scripts/download.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build and test Python package (Windows)
        working-directory: crates/ontologos-py
        shell: bash
        run: |
          python -m venv .venv
          source .venv/Scripts/activate
          pip install 'maturin>=1.7,<2.0' pytest
          maturin develop --release
          pytest tests/ -q

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: Download benchmark corpora
        run: ./benchmarks/scripts/download.sh
      - name: Test (MSRV)
        run: cargo test --workspace --exclude ontologos-conformance --locked
      - name: EL Pizza golden conformance (MSRV)
        run: ./benchmarks/scripts/compare-pizza-el-golden.sh
      - name: HermiT conformance Tier A (MSRV — OWL WG catalog)
        env:
          ONTOLOGOS_CI_PROMOTED_ONLY: "1"
          ONTOLOGOS_DL_BUDGET_SECS: "30"
        run: >-
          cargo test -p ontologos-conformance --release --locked
          --test hermit_wg_generated
          --
          --test-threads=1

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Download benchmark corpora
        run: ./benchmarks/scripts/download.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build and test Python package
        working-directory: crates/ontologos-py
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install 'maturin>=1.7,<2.0' pytest '.[pandas,polars]'
          maturin develop --release
          pytest tests/ -q

  python-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Download benchmark corpora
        run: ./benchmarks/scripts/download.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build and test Python package (macOS)
        working-directory: crates/ontologos-py
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install 'maturin>=1.7,<2.0' pytest
          maturin develop --release
          pytest tests/ -q

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install MkDocs
        run: pip install -r docs/requirements.txt
      - name: Build documentation site
        run: |
          chmod +x docs/build-site.sh
          ./docs/build-site.sh
