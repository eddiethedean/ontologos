name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # DL budget for contract catalog sample (WG entailment may classify twice).
  ONTOLOGOS_DL_BUDGET_SECS: "30"
  # WG corpus consistency shortcuts (conformance CI only; see ontologos-dl bounded.rs).
  ONTOLOGOS_WG_SHORTCUTS: "1"
  ONTOLOGOS_CONFORMANCE: "1"
  ONTOLOGOS_DL_MAX_WORKERS: "10"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Download benchmark corpora
        run: ./benchmarks/scripts/download.sh
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --exclude ontologos-conformance --exclude ontologos-contract --locked
      - name: User API contract tests
        run: cargo test -p ontologos-contract --release --locked
      - name: Build native binding libraries
        run: cargo build -p ontologos-jni -p ontologos-dotnet -p ontologos-c --release --locked
      - name: HermiT ignore budget
        run: |
          chmod +x benchmarks/scripts/check-hermit-ignore-budget.sh
          ./benchmarks/scripts/check-hermit-ignore-budget.sh
      - name: EL Pizza golden conformance
        run: ./benchmarks/scripts/compare-pizza-el-golden.sh
      - name: HermiT Tier B classification fixtures
        run: |
          chmod +x benchmarks/scripts/compare-classification-fixtures.sh
          ./benchmarks/scripts/compare-classification-fixtures.sh
      - name: Conformance test inventory (informational)
        run: |
          chmod +x benchmarks/scripts/report-conformance-coverage.sh
          ./benchmarks/scripts/report-conformance-coverage.sh
      - name: DL OFN pass rate (informational)
        run: |
          chmod +x benchmarks/scripts/report-dl-ofn-pass-rate.sh
          ./benchmarks/scripts/report-dl-ofn-pass-rate.sh || true
      - name: PR gates
        run: |
          chmod +x benchmarks/scripts/check-pr-gates.sh
          ./benchmarks/scripts/check-pr-gates.sh
      - name: HermiT parity phases
        run: |
          chmod +x benchmarks/scripts/check-hermit-parity-phases.sh
          ./benchmarks/scripts/check-hermit-parity-phases.sh
      - name: HermiT catalog drift check
        run: |
          chmod +x benchmarks/scripts/check-hermit-catalog.sh
          ./benchmarks/scripts/check-hermit-catalog.sh
      - name: Tier C reference harness smoke
        run: |
          chmod +x benchmarks/scripts/compare-tier-c-gate.sh
          chmod +x benchmarks/scripts/compare-hermit-tier-c.sh
          chmod +x benchmarks/scripts/compare-dl-taxonomy.sh
          chmod +x benchmarks/scripts/compare-taxonomy.py
          ./benchmarks/scripts/compare-tier-c-gate.sh
          ./benchmarks/scripts/compare-hermit-tier-c.sh
      - name: Reasonable RL adapter conformance
        run: ./benchmarks/scripts/compare-reasonable.sh
      - name: EL incremental correctness
        run: cargo test -p ontologos-el --test incremental_correctness --locked
      - name: Build CLI
        run: cargo build -p ontologos-cli --release
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Download HermiT JAR
        run: |
          chmod +x benchmarks/scripts/download-hermit-jar.sh
          ./benchmarks/scripts/download-hermit-jar.sh
      - name: Tier C strict taxonomy (HermiT, informational)
        env:
          HERMIT_JAR: benchmarks/data/hermit.jar
        run: |
          chmod +x benchmarks/scripts/compare-tier-c-strict-family.sh
          chmod +x benchmarks/scripts/audit-taxonomy-extras.sh
          ./benchmarks/scripts/compare-tier-c-strict-family.sh || true
      - name: Tier D perf gate (Family DL)
        run: |
          chmod +x benchmarks/scripts/compare-tier-d-perf-gate.sh
          ./benchmarks/scripts/compare-tier-d-perf-gate.sh

  python-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Download benchmark corpora
        run: bash ./benchmarks/scripts/download.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build and test Python package (Windows)
        working-directory: crates/ontologos-py
        shell: bash
        run: |
          python -m venv .venv
          source .venv/Scripts/activate
          pip install 'maturin>=1.7,<2.0' pytest
          maturin develop --release
          pytest tests/ -q

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: Download benchmark corpora
        run: ./benchmarks/scripts/download.sh
      - name: Test (MSRV)
        run: cargo test --workspace --exclude ontologos-conformance --exclude ontologos-contract --locked
      - name: EL Pizza golden conformance (MSRV)
        run: ./benchmarks/scripts/compare-pizza-el-golden.sh
      - name: User API contract tests (MSRV)
        env:
          ONTOLOGOS_DL_BUDGET_SECS: "30"
        run: cargo test -p ontologos-contract --release --locked
      - name: Build native binding libraries (MSRV)
        run: cargo build -p ontologos-jni -p ontologos-dotnet -p ontologos-c --release --locked

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Download benchmark corpora
        run: ./benchmarks/scripts/download.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build and test Python package
        working-directory: crates/ontologos-py
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install 'maturin>=1.7,<2.0' pytest '.[pandas,polars]'
          maturin develop --release
          pytest tests/ -q
      - name: Pyright (python + tests)
        working-directory: crates/ontologos-py
        run: |
          source .venv/bin/activate
          pip install pyright
          pyright python tests

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build and test Node/WASM bindings
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          bash scripts/ci-node.sh

  bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install C/C++ build tools
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential
      - name: Build and test Java, .NET, and C/C++ bindings
        env:
          ONTOLOGOS_REPO_ROOT: ${{ github.workspace }}
        run: bash scripts/ci-bindings.sh

  python-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Download benchmark corpora
        run: ./benchmarks/scripts/download.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build and test Python package (macOS)
        working-directory: crates/ontologos-py
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install 'maturin>=1.7,<2.0' pytest
          maturin develop --release
          pytest tests/ -q

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install MkDocs
        run: pip install -r docs/requirements.txt
      - name: Build documentation site
        run: |
          chmod +x docs/build-site.sh
          ./docs/build-site.sh
