name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish to crates.io and PyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify tag matches workspace version
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#v}"
          workspace_version="$(cargo metadata --format-version=1 --no-deps \
            | jq -r '.packages[] | select(.name == "ontologos-core") | .version')"
          if [ "$version" != "$workspace_version" ]; then
            echo "Tag version ($version) does not match workspace version ($workspace_version)"
            exit 1
          fi

      - name: Download benchmark corpora
        run: ./benchmarks/scripts/download.sh

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: ./.github/scripts/publish-crates.sh

      - name: Publish PyPI package
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "${PYPI_API_TOKEN}" ]; then
            echo "Skipping PyPI publish (PYPI_API_TOKEN not set)"
            exit 0
          fi
          pip install 'maturin>=1.7,<2.0'
          ./.github/scripts/publish-pypi.sh
