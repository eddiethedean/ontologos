name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Verify tag matches workspace version
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#v}"
          workspace_version="$(cargo metadata --format-version=1 --no-deps \
            | jq -r '.packages[] | select(.name == "ontologos-core") | .version')"
          if [ "$version" != "$workspace_version" ]; then
            echo "Tag version ($version) does not match workspace version ($workspace_version)"
            exit 1
          fi

      - name: Test
        run: cargo test --workspace --locked

      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: ./.github/scripts/publish-crates.sh
