name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      pypi_only:
        description: "Skip verify and crates.io (PyPI wheels + upload only)"
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify release
    if: github.event_name == 'push' || !inputs.pypi_only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Verify tag matches workspace version
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#v}"
          workspace_version="$(cargo metadata --format-version=1 --no-deps \
            | jq -r '.packages[] | select(.name == "ontologos-core") | .version')"
          if [ "$version" != "$workspace_version" ]; then
            echo "Tag version ($version) does not match workspace version ($workspace_version)"
            exit 1
          fi

      - name: Download benchmark corpora
        run: ./benchmarks/scripts/download.sh

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: EL Pizza golden conformance
        run: ./benchmarks/scripts/compare-pizza-el-golden.sh

      - name: HermiT conformance (Tier A — full catalog @ 30s)
        env:
          ONTOLOGOS_DL_BUDGET_SECS: "30"
          ONTOLOGOS_WG_SHORTCUTS: "1"
        run: cargo test -p ontologos-conformance --release --locked

      - name: Conformance coverage and 1.0 gates
        run: |
          chmod +x benchmarks/scripts/report-conformance-coverage.sh
          chmod +x benchmarks/scripts/check-1.0-release-gates.sh
          chmod +x benchmarks/scripts/check-hermit-parity-phases.sh
          ./benchmarks/scripts/report-conformance-coverage.sh
          ./benchmarks/scripts/check-1.0-release-gates.sh
          ./benchmarks/scripts/check-hermit-parity-phases.sh

      - name: Reasonable RL adapter conformance
        run: ./benchmarks/scripts/compare-reasonable.sh

      - name: EL incremental correctness
        run: cargo test -p ontologos-el --test incremental_correctness --locked

  publish-crates:
    name: Publish Rust crates
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: ./.github/scripts/publish-crates.sh

  publish-wasmer:
    name: Publish Wasmer package
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Setup Wasmer
        uses: wasmerio/setup-wasmer@v3.1

      - name: Publish to Wasmer Registry
        env:
          WASMER_TOKEN: ${{ secrets.WASMER_TOKEN }}
        run: ./.github/scripts/publish-wasmer.sh

  publish-npm-wasm:
    name: Publish npm @ontologos/wasm
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Publish @ontologos/wasm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: ./.github/scripts/publish-npm-wasm.sh

  build-npm-node:
    name: Build Node ${{ matrix.target }}
    if: github.event_name == 'push'
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: npm-node-${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install and build native addon
        working-directory: crates/ontologos-node
        shell: bash
        run: |
          npm install
          npx napi build --platform --release --target "${{ matrix.target }}"

      - name: Upload native binary
        uses: actions/upload-artifact@v4
        with:
          name: npm-node-${{ matrix.target }}
          path: crates/ontologos-node/ontologos.*.node
          if-no-files-found: error

  publish-npm-node:
    name: Publish npm ontologos
    if: github.event_name == 'push'
    needs: [verify, build-npm-node]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download native binaries
        uses: actions/download-artifact@v4
        with:
          pattern: npm-node-*
          path: crates/ontologos-node
          merge-multiple: true

      - name: Publish ontologos
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: ./.github/scripts/publish-npm-node.sh

  pypi-linux:
    name: PyPI wheels (Linux ${{ matrix.target }})
    needs: verify
    if: always() && (needs.verify.result == 'success' || needs.verify.result == 'skipped')
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64
            runs-on: ubuntu-latest
          - target: aarch64
            runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/ontologos-py
          target: ${{ matrix.target }}
          command: build
          args: --release --out dist
          sccache: "true"
          manylinux: auto

      - uses: actions/upload-artifact@v4
        with:
          name: pypi-linux-${{ matrix.target }}
          path: crates/ontologos-py/dist/*.whl

  pypi-macos:
    name: PyPI wheels (macOS ${{ matrix.target }})
    needs: verify
    if: always() && (needs.verify.result == 'success' || needs.verify.result == 'skipped')
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64, x86_64]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/ontologos-py
          target: ${{ matrix.target }}
          command: build
          args: --release --out dist
          sccache: "true"

      - uses: actions/upload-artifact@v4
        with:
          name: pypi-macos-${{ matrix.target }}
          path: crates/ontologos-py/dist/*.whl

  pypi-windows:
    name: PyPI wheels (Windows ${{ matrix.target }})
    needs: verify
    if: always() && (needs.verify.result == 'success' || needs.verify.result == 'skipped')
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x64, aarch64]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/ontologos-py
          target: ${{ matrix.target }}
          command: build
          args: --release --out dist
          sccache: "true"

      - uses: actions/upload-artifact@v4
        with:
          name: pypi-windows-${{ matrix.target }}
          path: crates/ontologos-py/dist/*.whl

  pypi-sdist:
    name: PyPI sdist
    needs: verify
    if: always() && (needs.verify.result == 'success' || needs.verify.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/ontologos-py
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: pypi-sdist
          path: crates/ontologos-py/dist/*.tar.gz

  publish-pypi:
    name: Publish PyPI package
    needs: [publish-crates, pypi-linux, pypi-macos, pypi-windows, pypi-sdist]
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      (needs.publish-crates.result == 'success' || needs.publish-crates.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pypi-*
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      - name: Publish to PyPI
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "${PYPI_API_TOKEN}" ]; then
            echo "Skipping PyPI publish (PYPI_API_TOKEN not set)"
            exit 0
          fi
          pip install 'maturin>=1.7,<2.0'
          MATURIN_PYPI_TOKEN="${PYPI_API_TOKEN}" maturin upload --skip-existing dist/*
