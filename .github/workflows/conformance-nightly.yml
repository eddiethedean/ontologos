name: Conformance Nightly

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  ONTOLOGOS_DL_BUDGET_SECS: "120"
  ONTOLOGOS_DL_WG_SHORTCUTS: "1"
  ONTOLOGOS_CONFORMANCE: "1"

jobs:
  ignored-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Download benchmark corpora
        run: ./benchmarks/scripts/download.sh
      - name: Conformance test inventory
        run: |
          chmod +x benchmarks/scripts/report-conformance-coverage.sh
          ./benchmarks/scripts/report-conformance-coverage.sh
      - name: Run ignored conformance tier
        run: cargo test -p ontologos-conformance -- --ignored --test-threads=4
      - name: Catalog scan regression (full DL budget)
        run: >-
          cargo test -p ontologos-conformance --release --test classify_timeout --
          --test-threads=1

  hermit-parity-tier-a:
    runs-on: ubuntu-latest
    env:
      ONTOLOGOS_DL_BUDGET_SECS: "30"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Download benchmark corpora
        run: ./benchmarks/scripts/download.sh
      - name: HermiT parity Tier A (full catalog @ 30s)
        run: >-
          cargo test -p ontologos-conformance --release --locked
          --test hermit_generated
          --test hermit_rdfs
          --test hermit_rl
          --test hermit_el
          --test hermit_parser
          --test hermit_wg_generated
          --test dl_subsumption_cases
          --test explain_benchmarks
          --
          --test-threads=4
          --skip planned_engine_failure_scan
          --skip ian_backjumping3_axiom_check_completes_within_budget
      - name: Phase 3 closure gate
        run: cargo test -p ontologos-conformance --test phase3_closure --locked
      - name: Phase 6 closure gate
        run: cargo test -p ontologos-conformance --test phase6_closure --release --locked
      - name: Phase 7 closure gate
        run: cargo test -p ontologos-conformance --test phase7_closure --release --locked
      - name: Promoted-list hygiene (Phase 9)
        run: >-
          cargo test -p ontologos-conformance --release --locked
          --test phase9_closure
          --
          --test-threads=1
          --skip phase9_true_parity_pct_is_100
      - name: 1.0 release gates (conformance)
        run: |
          chmod +x benchmarks/scripts/check-1.0-release-gates.sh
          ./benchmarks/scripts/check-1.0-release-gates.sh
      - name: True parity gate (Phase 8 final)
        run: |
          chmod +x benchmarks/scripts/check-true-parity-gate.sh
          ./benchmarks/scripts/check-true-parity-gate.sh

  tier-c-hermit-crosscheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Download benchmark corpora
        run: ./benchmarks/scripts/download.sh
      - name: Download HermiT JAR
        run: |
          chmod +x benchmarks/scripts/download-hermit-jar.sh
          ./benchmarks/scripts/download-hermit-jar.sh
      - name: Build release CLI
        run: cargo build -p ontologos-cli --release --locked
      - name: HermiT JAR cross-check (Tier C)
        env:
          HERMIT_JAR: benchmarks/data/hermit.jar
          ONTOLOGOS_REQUIRE_HERMIT_JAR: "1"
          RUN_SLOW_DL_GATES: "1"
        run: |
          chmod +x benchmarks/scripts/compare-dl-hermit-crosscheck.sh
          ./benchmarks/scripts/compare-dl-hermit-crosscheck.sh
      - name: DL performance snapshot (informational)
        env:
          RUN_SLOW_DL_GATES: "1"
        run: |
          chmod +x benchmarks/scripts/benchmark-dl-perf.sh
          ./benchmarks/scripts/benchmark-dl-perf.sh || true
      - name: Tier C strict family cross-check (informational)
        env:
          HERMIT_JAR: benchmarks/data/hermit.jar
        run: |
          chmod +x benchmarks/scripts/compare-tier-c-strict-family.sh
          ./benchmarks/scripts/compare-tier-c-strict-family.sh || true

  full-hermit-suite:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Download benchmark corpora
        run: ./benchmarks/scripts/download.sh
      - name: Full HermiT + OWL WG suite (failure-first, non-blocking)
        run: |
          chmod +x benchmarks/scripts/run-hermit-full-suite.sh
          ./benchmarks/scripts/run-hermit-full-suite.sh
