# MkDocs configuration for OntoLogos (Read the Docs + local preview)
# https://www.mkdocs.org/

site_name: OntoLogos
site_description: Modular Rust ontology reasoner — OWL EL, RL, RDFS, OWL 2 DL, and SWRL
site_url: https://ontologos.readthedocs.io/
repo_url: https://github.com/eddiethedean/ontologos
repo_name: eddiethedean/ontologos
edit_uri: edit/main/docs/

copyright: Copyright &copy; Odo Matthews

docs_dir: docs

exclude_docs: |
  snippets/
  internal/research/
  internal/roadmap.md
  internal/upstream-reasonable-gaps.md
  internal/hermit-parity-gap-report.md
  internal/hermit-parity-honest-assessment.md
  internal/planned-backlog-triage.md
  internal/v0.5-docs-plan.md
  internal/parity-roadmap.md
  README.md
  project/overview.md
  project/roadmap.md
  project/post-1.0-doc-update.md
  project/release-1.0-checklist.md
  project/spec.md

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/custom.css

nav:
  - Home: index.md
  - Getting started:
      - Start here: guides/start-here.md
      - Install and channels: guides/install-channels.md
      - CLI installation: getting-started/cli-install.md
      - Known limitations: guides/known-limitations.md
      - Prerequisites: guides/prerequisites.md
      - Five-minute Rust guide: getting-started/index.md
      - Classify quick start: getting-started/classify-quickstart.md
      - Load an OWL file: getting-started/load-owl-file.md
      - First ontology: getting-started/first-ontology.md
      - By profile:
          - RDFS materialization: getting-started/rdfs-materialization.md
          - OWL RL saturation: getting-started/owl-rl-saturation.md
          - OWL EL classification: getting-started/owl-el-classification.md
          - SWRL: getting-started/swrl.md
  - Examples:
      - Gallery: examples/index.md
      - DL evaluation: examples/dl-evaluation.md
  - Guides:
      - Rust integration contract: guides/rust-integration-contract.md
      - Choosing an API: guides/choosing-an-api.md
      - Profile stability: guides/profile-stability.md
      - Preview profiles (ALC, dl-preview): guides/preview-profiles.md
      - Facade API: guides/facade-api.md
      - When not to use OntoLogos: guides/when-not-to-use.md
      - Evaluator scope: guides/evaluator-scope.md
      - Evaluator playbook: guides/evaluator-playbook.md
      - Profile detection: guides/profile-detection.md
      - Python: guides/python.md
      - Glossary: guides/glossary.md
      - Incremental reasoning: guides/incremental-reasoning.md
      - Protégé axiom counts: guides/protege-axiom-counts.md
      - Performance: guides/performance.md
      - Production integration: guides/production-integration.md
      - Deployment and observability: guides/deployment.md
      - Troubleshooting: guides/troubleshooting.md
      - Comparison: comparison.md
      - Security: security.md
  - Reference:
      - Reference index: reference/index.md
      - Architecture: architecture.md
      - Core API: reference/core.md
      - Facade API: reference/facade.md
      - Profile API: reference/profile.md
      - EL API: reference/el.md
      - RL API: reference/rl.md
      - OWL DL API: reference/dl.md
      - SWRL API: reference/swrl.md
      - CLI: reference/cli.md
      - Errors: reference/errors.md
      - Supported constructs: reference/supported-constructs.md
      - OWL imports: reference/owl-imports.md
      - Parser API: reference/parser.md
      - Python API: reference/python.md
      - Reasonable adapter limits: reference/reasonable-limits.md
      - Explain API: reference/explain.md
      - Query API: reference/query.md
      - QL API: reference/ql.md
      - JSON snapshot v3: json-snapshot-v3.md
      - JSON snapshot v2 (legacy): json-snapshot-v2.md
      - RL rules: reference/rl-rules.md
      - Conformance: reference/conformance.md
      - Contract tests: examples/contract-tests.md
      - Taxonomy tolerance: reference/taxonomy-tolerance.md
      - Rust API (docs.rs):
          - ontologos-core: https://docs.rs/ontologos-core/1.0.0
          - ontologos-profile: https://docs.rs/ontologos-profile/1.0.0
          - ontologos-parser: https://docs.rs/ontologos-parser/1.0.0
          - ontologos-bridge: https://docs.rs/ontologos-bridge/1.0.0
          - ontologos-rl: https://docs.rs/ontologos-rl/1.0.0
          - ontologos-el: https://docs.rs/ontologos-el/1.0.0
          - ontologos-alc: https://docs.rs/ontologos-alc/1.0.0
          - ontologos-dl: https://docs.rs/ontologos-dl/1.0.0
          - ontologos-swrl: https://docs.rs/ontologos-swrl/1.0.0
          - ontologos-explain: https://docs.rs/ontologos-explain/1.0.0
          - ontologos-ql: https://docs.rs/ontologos-ql/1.0.0
          - ontologos-facade: https://docs.rs/ontologos-facade/1.0.0
  - Migration:
      - Upgrade to latest: migration/index.md
      - Historical migrations: migration/historical.md
      - v0.8.x to v0.9.0: migration/v0.8.x-to-v0.9.0.md
      - v0.8.x to v1.0.0: migration/v0.8.x-to-v1.0.0.md
      - v0.9.x to v1.0.0: migration/v0.9.x-to-v1.0.0.md
  - Project:
      - FAQ: project/faq.md
      - Release status: project/release-status.md
      - Release notes: project/release-notes.md
      - Roadmap summary: project/roadmap-summary.md
      - Changelog: project/changelog.md
      - Contributing: project/contributing.md
      - HermiT burndown (contributors): guides/hermit-burndown.md
      - Documentation build: readthedocs.md
      - Benchmarks: project/benchmarks.md
      - Security policy: project/security-policy.md
      - Code of conduct: project/code-of-conduct.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - include-markdown

hooks:
  - docs/hooks/rtd_links.py

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/eddiethedean/ontologos
    - icon: fontawesome/brands/rust
      link: https://docs.rs/ontologos-core/1.0.0
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/ontologos/

validation:
  nav:
    omitted_files: ignore
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: ignore
    unrecognized_links: ignore
