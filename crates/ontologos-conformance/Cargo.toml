[package]
name = "ontologos-conformance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "HermiT and OWL conformance test harness for OntoLogos"
publish = false

[dependencies]
ontologos-alc = { workspace = true }
ontologos-bridge = { workspace = true }
ontologos-core = { workspace = true }
ontologos-parser = { workspace = true }
ontologos-rdfs = { workspace = true }
ontologos-rl = { workspace = true }
ontologos-el = { workspace = true }
ontologos-dl = { workspace = true }
ontologos-swrl = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[[bin]]
name = "dl_ofn_pass_rate"
path = "src/bin/dl_ofn_pass_rate.rs"

[[bin]]
name = "promote_catalog"
path = "src/bin/promote_catalog.rs"

[[bin]]
name = "dl_failures"
path = "src/bin/dl_failures.rs"

[dev-dependencies]
ontologos-conformance = { path = "." }
ontologos-el = { workspace = true }
ontologos-explain = { workspace = true }
ontologos-rl = { workspace = true }
