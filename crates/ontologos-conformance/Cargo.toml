[package]
name = "ontologos-conformance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "HermiT and OWL conformance test harness for OntoLogos"
publish = false


[lints]
workspace = true

[dependencies]
ontologos-alc = { workspace = true }
ontologos-bridge = { workspace = true }
ontologos-core = { workspace = true }
ontologos-parser = { workspace = true }
ontologos-rl = { workspace = true }
ontologos-el = { workspace = true }
ontologos-dl = { workspace = true }
ontologos-facade = { workspace = true }
ontologos-swrl = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
rayon = { workspace = true }
thiserror = { workspace = true }

[[bin]]
name = "dl_ofn_pass_rate"
path = "src/bin/dl_ofn_pass_rate.rs"

[[bin]]
name = "promote_catalog"
path = "src/bin/promote_catalog.rs"

[[bin]]
name = "promote_wg"
path = "src/bin/promote_wg.rs"

[[bin]]
name = "dl_failures"
path = "src/bin/dl_failures.rs"

[[bin]]
name = "engine_failures"
path = "src/bin/engine_failures.rs"

[[bin]]
name = "wg_failures"
path = "src/bin/wg_failures.rs"

[[bin]]
name = "audit_planned_backlog"
path = "src/bin/audit_planned_backlog.rs"

[[bin]]
name = "parity_status"
path = "src/bin/parity_status.rs"

[[bin]]
name = "sync_promoted"
path = "src/bin/sync_promoted.rs"

[dev-dependencies]
ontologos-conformance = { path = "." }
ontologos-el = { workspace = true }
ontologos-explain = { workspace = true }
ontologos-rl = { workspace = true }
