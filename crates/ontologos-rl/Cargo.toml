[package]
name = "ontologos-rl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "OWL RL rule-based reasoning engine for OntoLogos"
readme = "README.md"
keywords = ["owl", "ontology", "owl-rl", "reasoner", "semantic-web"]
categories = ["science"]
publish = true

[package.metadata.docs.rs]
all-features = true

[features]
default = ["parallel"]
parallel = ["dep:rayon"]

[dependencies]
ontologos-core = { workspace = true }
ontologos-rdfs = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
rayon = { version = "1", optional = true }

[dev-dependencies]
ontologos-parser = { workspace = true }
criterion = { version = "0.5", features = ["html_reports"] }

[[example]]
name = "rl_saturation"
path = "examples/rl_saturation.rs"

[[bench]]
name = "rl_parallel"
harness = false
