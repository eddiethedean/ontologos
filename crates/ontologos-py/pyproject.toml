[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "ontologos"
version = "1.1.3"
description = "Python bindings for the OntoLogos OWL reasoner — RDFS, OWL RL, and OWL EL classification"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Odo Matthews", email = "odosmatthews@gmail.com" }]
keywords = ["owl", "ontology", "reasoner", "semantic-web", "description-logic"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=2.0"]
polars = ["polars>=0.20"]
dev = ["pytest>=8.0", "maturin>=1.7,<2.0", "pyright>=1.1"]

[project.urls]
Homepage = "https://github.com/eddiethedean/ontologos"
Repository = "https://github.com/eddiethedean/ontologos"
Documentation = "https://ontologos.readthedocs.io/"
"Bug Tracker" = "https://github.com/eddiethedean/ontologos/issues"

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "ontologos._ontologos"

[tool.pyright]
pythonVersion = "3.11"
include = ["python", "tests"]
extraPaths = ["python"]
venvPath = "."
venv = ".venv"
reportMissingImports = "error"
reportMissingModuleSource = "none"
