[workspace]
resolver = "2"
members = [
    "crates/ontologos-core",
    "crates/ontologos-bridge",
    "crates/ontologos-parser",
    "crates/ontologos-profile",
    "crates/ontologos-rdfs",
    "crates/ontologos-rl",
    "crates/ontologos-el",
    "crates/ontologos-query",
    "crates/ontologos-explain",
    "crates/ontologos-cli",
    "crates/ontologos-py",
    "crates/ontologos-conformance",
]

[workspace.package]
version = "0.6.1"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["Odo Matthews <odosmatthews@gmail.com>"]
repository = "https://github.com/eddiethedean/ontologos"
homepage = "https://github.com/eddiethedean/ontologos"
documentation = "https://ontologos.readthedocs.io/en/latest/"
description = "A modular Rust ontology reasoner supporting OWL EL, OWL RL, and RDFS"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
horned-owl = "1.4"
reasonable = "0.4"
oxrdf = "0.3"
petgraph = "0.7"
rayon = "1"
pyo3 = { version = "0.23" }

ontologos-core = { path = "crates/ontologos-core", version = "0.6.1" }
ontologos-bridge = { path = "crates/ontologos-bridge", version = "0.6.1" }
ontologos-parser = { path = "crates/ontologos-parser", version = "0.6.1" }
ontologos-profile = { path = "crates/ontologos-profile", version = "0.6.1" }
ontologos-rdfs = { path = "crates/ontologos-rdfs", version = "0.6.1" }
ontologos-rl = { path = "crates/ontologos-rl", version = "0.6.1" }
ontologos-el = { path = "crates/ontologos-el", version = "0.6.1" }
ontologos-query = { path = "crates/ontologos-query", version = "0.6.1" }
ontologos-explain = { path = "crates/ontologos-explain", version = "0.6.1" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
