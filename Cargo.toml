[workspace]
resolver = "2"
members = [
    "crates/ontologos-core",
    "crates/ontologos-bridge",
    "crates/ontologos-parser",
    "crates/ontologos-profile",
    "crates/ontologos-rl",
    "crates/ontologos-el",
    "crates/ontologos-alc",
    "crates/ontologos-ql",
    "crates/ontologos-dl",
    "crates/ontologos-swrl",
    "crates/ontologos-facade",
    "crates/ontologos-explain",
    "crates/ontologos-cli",
    "crates/ontologos-py",
    "crates/ontologos-js",
    "crates/ontologos-wasm",
    "crates/ontologos-node",
    "crates/ontologos-conformance",
    "crates/ontologos-contract",
]

[workspace.package]
version = "1.0.1"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["Odo Matthews <odosmatthews@gmail.com>"]
repository = "https://github.com/eddiethedean/ontologos"
homepage = "https://github.com/eddiethedean/ontologos"
documentation = "https://ontologos.readthedocs.io/en/latest/"
description = "A modular Rust ontology reasoner supporting OWL EL, OWL RL, and RDFS"

[workspace.dependencies]
tracing = "0.1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
horned-owl = { version = "1.4", default-features = false }
reasonable = "0.4"
oxrdf = "0.3"
petgraph = "0.7"
rayon = "1"
pyo3 = { version = "0.23" }
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
napi = { version = "2", default-features = false, features = ["napi4", "serde-json"] }
napi-derive = "2"
napi-build = "2"

ontologos-js = { path = "crates/ontologos-js", version = "1.0.1" }

ontologos-core = { path = "crates/ontologos-core", version = "1.0.1" }
ontologos-bridge = { path = "crates/ontologos-bridge", version = "1.0.1" }
ontologos-parser = { path = "crates/ontologos-parser", version = "1.0.1" }
ontologos-profile = { path = "crates/ontologos-profile", version = "1.0.1" }
ontologos-rl = { path = "crates/ontologos-rl", version = "1.0.1" }
ontologos-el = { path = "crates/ontologos-el", version = "1.0.1" }
ontologos-alc = { path = "crates/ontologos-alc", version = "1.0.1" }
ontologos-ql = { path = "crates/ontologos-ql", version = "1.0.1" }
ontologos-dl = { path = "crates/ontologos-dl", version = "1.0.1" }
ontologos-swrl = { path = "crates/ontologos-swrl", version = "1.0.1" }
ontologos-facade = { path = "crates/ontologos-facade", version = "1.0.1" }
ontologos-explain = { path = "crates/ontologos-explain", version = "1.0.1" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Pedantic deferred: enabling workspace inheritance without mass doc-section churn.
pedantic = { level = "allow", priority = -1 }
