[workspace]
resolver = "2"
members = [
    "crates/ontologos-core",
    "crates/ontologos-parser",
    "crates/ontologos-profile",
    "crates/ontologos-rdfs",
    "crates/ontologos-rl",
    "crates/ontologos-el",
    "crates/ontologos-query",
    "crates/ontologos-explain",
    "crates/ontologos-cli",
    "crates/ontologos-py",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "MIT OR Apache-2.0"
authors = ["Odo Matthews <odosmatthews@gmail.com>"]
repository = "https://github.com/eddiethedean/ontologos"
homepage = "https://github.com/eddiethedean/ontologos"
description = "A modular Rust ontology reasoner supporting OWL EL, OWL RL, and RDFS"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
horned-owl = "1.4"
pyo3 = { version = "0.23" }

ontologos-core = { path = "crates/ontologos-core" }
ontologos-parser = { path = "crates/ontologos-parser" }
ontologos-profile = { path = "crates/ontologos-profile" }
ontologos-rdfs = { path = "crates/ontologos-rdfs" }
ontologos-rl = { path = "crates/ontologos-rl" }
ontologos-el = { path = "crates/ontologos-el" }
ontologos-query = { path = "crates/ontologos-query" }
ontologos-explain = { path = "crates/ontologos-explain" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
